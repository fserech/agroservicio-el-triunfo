<ng-template #cuerpo>
<div class="relative h-full bg-white border border-slate-200 rounded-xl p-3.5 overflow-hidden transition-all hover:shadow-md hover:border-slate-300"
     [title]="hint()">
  <div class="flex items-center gap-1.5 text-[10px] font-semibold uppercase tracking-wider text-slate-400">
    <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" [style.background]="color()"></span>
    <span class="truncate">{{ label() }}</span>
  </div>
  <div class="mt-1.5 text-xl leading-tight font-bold text-slate-800 tracking-tight tabular-nums whitespace-nowrap">{{ value() }}</div>
  <div class="mt-1.5 flex flex-wrap items-center gap-x-1.5 gap-y-0.5 min-w-0">
    @if (delta() !== undefined) {
      <span class="flex-shrink-0 inline-flex items-center gap-0.5 px-1.5 py-0.5 rounded-md text-[10px] font-semibold ring-1 ring-inset tabular-nums"
            [class]="chip()">
        @if (flecha()) { <span class="text-[8px]">{{ flecha() }}</span> }{{ texto() }}
      </span>
    }
    @if (sub()) { <span class="text-[11px] text-slate-400">{{ sub() }}</span> }
  </div>
  @if (spark() && spark()!.length > 1) {
    <div class="mt-2.5 h-9"><app-sparkline [values]="spark()!" [color]="color()" /></div>
  }
</div>
</ng-template>

@if (link()) {
  <a [routerLink]="link()" class="block h-full cursor-pointer no-underline" [title]="'Ver detalle en ' + link()">
    <ng-container *ngTemplateOutlet="cuerpo" />
  </a>
} @else {
  <ng-container *ngTemplateOutlet="cuerpo" />
}
