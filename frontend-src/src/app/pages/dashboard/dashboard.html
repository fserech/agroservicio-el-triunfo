<div class="p-4 lg:p-5 space-y-4 max-w-[1600px] mx-auto">

  <div class="flex flex-wrap items-center justify-between gap-3">
    <div>
      <h2 class="font-display font-bold text-slate-800 text-base">Panel de Control</h2>
      <p class="text-[11px] text-slate-400">Indicadores calculados con tus ventas reales · actualizado {{ hora() }}</p>
    </div>

    <div class="flex flex-wrap items-center gap-2">
      <div class="inline-flex p-0.5 bg-slate-100 rounded-lg text-xs">
        <button class="px-3 py-1.5 rounded-md font-semibold transition-all"
          [class]="tab() === 'resumen' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
          (click)="irA('resumen')">📊 Resumen</button>
        <button class="px-3 py-1.5 rounded-md font-semibold transition-all"
          [class]="tab() === 'prediccion' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
          (click)="irA('prediccion')">🔮 Predicción de productos</button>
      </div>

      @if (tab() === 'resumen') {
        <div class="inline-flex p-0.5 bg-slate-100 rounded-lg text-[11px]">
          @for (p of periodos; track p) {
            <button class="px-2.5 py-1.5 rounded-md font-semibold transition-all"
              [class]="dias() === p ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'"
              (click)="dias.set(p)">{{ p }} d</button>
          }
        </div>
      }

      <button class="btn-secondary" (click)="refreshAll()">
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        Actualizar
      </button>
    </div>
  </div>

  <div [class.hidden]="tab() !== 'resumen'">
    <app-dash-resumen [dias]="dias()" [refresh]="tick()" />
  </div>

  @if (visitoPrediccion()) {
    <div [class.hidden]="tab() !== 'prediccion'">
      <app-dash-prediccion [refresh]="tick()" />
    </div>
  }
</div>
